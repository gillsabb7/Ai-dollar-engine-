
name: FactSpark Hindi - Build Improved 5-Fact Short

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Check FFmpeg
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow edge-tts

      - name: Generate video
        run: python generate_short_video.py

      - name: Upload video
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: factspark-improved-5-fact-short
          path: |
            video_output/*.mp4
            video_output/*.txt
          if-no-files-found: error
          retention-days: 7
