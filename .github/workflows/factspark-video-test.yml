name: FactSpark Hindi - Build Improved 5-Fact Short

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: python -m pip install --upgrade pip pillow edge-tts

      - name: Generate improved 5-fact Short
        run: python generate_short_video.py

      - name: Upload MP4 and script as downloadable artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: factspark-improved-5-fact-short
          path: video_output/
          if-no-files-found: error
          retention-days: 7
